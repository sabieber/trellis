<!DOCTYPE html>
<html lang="">
<head>
    <meta charset="UTF-8">
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <link rel="icon" href="/favicon.ico">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>trellis</title>
    <!-- Sets the theme before the first paint, so a light device never flashes
         dark. Mirrors utils/theme.ts, which takes over once the app loads. -->
    <script>
        (function () {
            var names = {dark: 'trellis', light: 'trellis-light', eink: 'trellis-eink'};
            var choice = 'dark';
            try { choice = localStorage.getItem('theme') || 'dark'; } catch (e) {}
            if (choice === 'system') {
                choice = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
            }
            document.documentElement.dataset.theme = names[choice] || 'trellis';
        })();
    </script>
</head>
<body>
<div id="app"></div>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
